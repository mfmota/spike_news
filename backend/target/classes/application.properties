server.port=8080

# SQLite Database with WAL mode & busy timeout
spring.datasource.url=jdbc:sqlite:valorant.db?journal_mode=WAL&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
app.jwt.secret=SpikeNewsSecretKeySuperSecureJwtTokenMustBeAtLeast256BitsLong2026!
app.jwt.expiration-ms=86400000

# Internal Webhook Key for Python Scraper
app.internal.api-key=spike-news-internal-scraper-key-2026

# External API: valorant-api.com
valorant.api.base-url=https://valorant-api.com/v1
valorant.api.language=pt-BR
